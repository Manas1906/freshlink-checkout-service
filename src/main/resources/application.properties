spring.application.name=checkout-service
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/freshlink_checkout?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

auth.jwt.secret=FreshLinkSuperSecretKeyThatIs32BytesLong!!
spring.cloud.compatibility-verifier.enabled=false
spring.cloud.openfeign.lazy-attributes-resolution=true
spring.main.allow-bean-definition-overriding=true


order.service.url=http://localhost:8083
product.service.url=http://localhost:8082
cart.service.url=http://localhost:8084
payment.service.url=http://localhost:8086


spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=checkout-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.properties.max.block.ms=500
